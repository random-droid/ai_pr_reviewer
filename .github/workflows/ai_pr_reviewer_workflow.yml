name: Pull Request AI review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai_pr_reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for RAG context

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.genai/io/capstone/requirements.txt'

      - name: Install dependencies
        run: pip install -r .genai/io/capstone/requirements.txt

      - name: Run Reviewer Script
        env:
          # GitHub context
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PULL_NUMBER: ${{ github.event.number }}
          TARGET_EXTENSIONS: ${{ vars.TARGET_EXTENSIONS }}

          # AI Provider selection (openai, gemini, or claude)
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'claude' }}

          # Provider API keys (set the one you use)
          CHATGPT_KEY: ${{ secrets.CHATGPT_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Model override (optional - uses defaults if not set)
          CHATGPT_MODEL: ${{ vars.CHATGPT_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}

        working-directory: .genai/io/capstone
        run: |
          python github_reviewer.py

      - name: Upload result as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-requests
          path: .genai/io/capstone/output.txt
          retention-days: 1
